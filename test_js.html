<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار JavaScript</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h2>اختبار تحميل JavaScript</h2>

      <!-- نفس العناصر الموجودة في الصفحة الأصلية -->
      <div class="row">
        <div class="col-md-6">
          <label>النص الأصلي:</label>
          <textarea
            id="originalText"
            class="form-control"
            rows="3"
            placeholder="اكتب النص هنا..."
          >
أعاني من صداع شديد</textarea
          >
        </div>
        <div class="col-md-6">
          <label>النص المترجم:</label>
          <textarea
            id="translatedText"
            class="form-control"
            rows="3"
            readonly
          ></textarea>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-6">
          <label>من:</label>
          <select id="sourceLanguage" class="form-select">
            <option value="auto">اكتشف تلقائياً</option>
            <option value="ar" selected>العربية</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="col-md-6">
          <label>إلى:</label>
          <select id="targetLanguage" class="form-select">
            <option value="en" selected>English</option>
            <option value="ar">العربية</option>
          </select>
        </div>
      </div>

      <div class="mt-3">
        <button type="button" id="translateBtn" class="btn btn-primary">
          <i class="fas fa-language me-2"></i>ترجم
        </button>
        <button
          type="button"
          id="useTranslationBtn"
          class="btn btn-success"
          disabled
        >
          استخدام الترجمة
        </button>
        <button
          type="button"
          id="clearTranslationBtn"
          class="btn btn-outline-secondary"
        >
          مسح
        </button>
        <button
          type="button"
          id="swapLanguagesBtn"
          class="btn btn-outline-info"
        >
          تبديل
        </button>
      </div>

      <div id="translationStatus" class="mt-3"></div>

      <!-- حقل الوصف المخفي -->
      <textarea name="description" style="display: none"></textarea>

      <!-- CSRF Token -->
      <input type="hidden" name="csrfmiddlewaretoken" value="test-token" />

      <div class="mt-4">
        <h5>سجل الأحداث:</h5>
        <div
          id="logOutput"
          style="
            background: #000;
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            height: 200px;
            overflow-y: auto;
          "
        ></div>
      </div>
    </div>

    <script>
      // Override console.log to capture logs
      const originalLog = console.log;
      const originalError = console.error;
      const logOutput = document.getElementById("logOutput");

      function addLog(message, type = "log") {
        const timestamp = new Date().toLocaleTimeString();
        const color = type === "error" ? "#f00" : "#0f0";
        logOutput.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
        logOutput.scrollTop = logOutput.scrollHeight;
      }

      console.log = function (...args) {
        originalLog.apply(console, args);
        addLog(args.join(" "), "log");
      };

      console.error = function (...args) {
        originalError.apply(console, args);
        addLog(args.join(" "), "error");
      };

      console.log("🔄 بدء تحميل الصفحة...");
    </script>

    <!-- تحميل ملف JavaScript -->
    <script src="/static/js/instant-translator.js"></script>

    <script>
      // اختبار إضافي بعد تحميل الملف
      setTimeout(() => {
        console.log("🔍 فحص الدوال العامة:");
        console.log("window.translateText:", typeof window.translateText);
        console.log("window.useTranslation:", typeof window.useTranslation);

        // اختبار الزر مباشرة
        const btn = document.getElementById("translateBtn");
        if (btn) {
          console.log("✅ زر الترجمة موجود");
          btn.addEventListener("click", function () {
            console.log("🖱️ تم الضغط على الزر (اختبار مباشر)");
          });
        } else {
          console.error("❌ زر الترجمة غير موجود");
        }
      }, 1000);
    </script>
  </body>
</html>
