{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "تغيير كلمة المرور" %}{% endblock %}

{% block content %}
<div class="container py-4">
  <h2><i class="fas fa-key me-2"></i>{% trans "تغيير كلمة المرور" %}</h2>
  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">{% trans "كلمة المرور الحالية" %}</label>
      <input type="password" name="current_password" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">{% trans "كلمة المرور الجديدة" %}</label>
      <input type="password" name="new_password1" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">{% trans "تأكيد كلمة المرور الجديدة" %}</label>
      <input type="password" name="new_password2" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">
      <i class="fas fa-save me-1"></i>{% trans "حفظ" %}
    </button>
    <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary ms-2">{% trans "إلغاء" %}</a>
  </form>
</div>
{% endblock %}
