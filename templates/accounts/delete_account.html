{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "حذف الحساب" %}{% endblock %}

{% block content %}
<div class="container py-4">
  <h2 class="text-danger"><i class="fas fa-user-times me-2"></i>{% trans "حذف الحساب" %}</h2>
  <p class="mt-3">{% trans "هذا الإجراء لا يمكن التراجع عنه. سيتم حذف حسابك وجميع بياناتك المرتبطة به." %}</p>
  <form method="post" class="mt-3" onsubmit="return confirm('{% trans "هل أنت متأكد من رغبتك في حذف حسابك؟" %}')">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">{% trans "حذف نهائي" %}</button>
    <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary ms-2">{% trans "إلغاء" %}</a>
  </form>
</div>
{% endblock %}
