{% extends 'base.html' %} {% load static %} {% block title %}اختبار الترجمة
البسيط{% endblock %} {% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h3><i class="fas fa-language me-2"></i>اختبار الترجمة البسيط</h3>
        </div>
        <div class="card-body">
          <form>
            {% csrf_token %}

            <div class="mb-3">
              <label for="originalText" class="form-label"
                >النص الأصلي (العربية):</label
              >
              <textarea
                id="originalText"
                class="form-control"
                rows="4"
                placeholder="اكتب النص العربي هنا..."
              >
أعاني من صداع شديد منذ يومين</textarea
              >
            </div>

            <div class="mb-3">
              <label for="translatedText" class="form-label"
                >النص المترجم (الإنجليزية):</label
              >
              <textarea
                id="translatedText"
                class="form-control"
                rows="4"
                readonly
                placeholder="الترجمة ستظهر هنا..."
              ></textarea>
            </div>

            <div class="mb-3">
              <button
                type="button"
                id="translateBtn"
                class="btn btn-primary btn-lg"
              >
                <i class="fas fa-language me-2"></i>ترجم الآن
              </button>
            </div>

            <div id="translationStatus" class="mt-3"></div>
          </form>
        </div>
      </div>

      <!-- سجل الأحداث -->
      <div class="card mt-4">
        <div class="card-header">
          <h5>سجل الأحداث (Console Log)</h5>
        </div>
        <div class="card-body">
          <div
            id="consoleLog"
            style="
              background: #000;
              color: #0f0;
              padding: 15px;
              border-radius: 5px;
              font-family: monospace;
              font-size: 12px;
              max-height: 300px;
              overflow-y: auto;
              white-space: pre-wrap;
            "
          ></div>
          <button id="clearConsole" class="btn btn-sm btn-secondary mt-2">
            مسح السجل
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // التقاط console.log
  const consoleLog = document.getElementById("consoleLog");
  const originalLog = console.log;
  const originalError = console.error;

  function addToLog(message, type = "log") {
    const timestamp = new Date().toLocaleTimeString();
    const color = type === "error" ? "#f00" : "#0f0";
    consoleLog.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
    consoleLog.scrollTop = consoleLog.scrollHeight;
  }

  console.log = function (...args) {
    originalLog.apply(console, args);
    addToLog(args.join(" "), "log");
  };

  console.error = function (...args) {
    originalError.apply(console, args);
    addToLog(args.join(" "), "error");
  };

  document
    .getElementById("clearConsole")
    .addEventListener("click", function () {
      consoleLog.innerHTML = "";
    });

  console.log("🔄 بدء تحميل صفحة الاختبار...");
</script>

<!-- تحميل المترجم المبسط -->
<script src="{% static 'js/simple-translator.js' %}"></script>

{% endblock %}
