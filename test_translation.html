<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اختبار الترجمة</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-header">
              <h3>
                <i class="fas fa-language me-2"></i>اختبار الترجمة الفورية
              </h3>
            </div>
            <div class="card-body">
              <form>
                <input
                  type="hidden"
                  name="csrfmiddlewaretoken"
                  value="test-token"
                />

                <div class="mb-3">
                  <label class="form-label">النص للترجمة:</label>
                  <textarea
                    id="originalText"
                    class="form-control"
                    rows="3"
                    placeholder="اكتب النص هنا..."
                  >
أعاني من صداع شديد منذ يومين</textarea
                  >
                </div>

                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">من:</label>
                    <select id="sourceLanguage" class="form-select">
                      <option value="auto">اكتشف تلقائياً</option>
                      <option value="ar" selected>العربية</option>
                      <option value="en">English</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">إلى:</label>
                    <select id="targetLanguage" class="form-select">
                      <option value="en" selected>English</option>
                      <option value="ar">العربية</option>
                    </select>
                  </div>
                </div>

                <div class="mb-3">
                  <button
                    type="button"
                    id="translateBtn"
                    class="btn btn-primary"
                  >
                    <i class="fas fa-language me-2"></i>ترجم
                  </button>
                </div>

                <div class="mb-3">
                  <label class="form-label">النتيجة:</label>
                  <textarea
                    id="translatedText"
                    class="form-control"
                    rows="3"
                    readonly
                  ></textarea>
                </div>

                <div id="translationStatus" class="mt-2"></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // DOM Elements
      const originalText = document.getElementById("originalText");
      const translatedText = document.getElementById("translatedText");
      const translateBtn = document.getElementById("translateBtn");
      const sourceLanguage = document.getElementById("sourceLanguage");
      const targetLanguage = document.getElementById("targetLanguage");
      const translationStatus = document.getElementById("translationStatus");

      // Auto-detect source language based on text content
      function detectLanguage(text) {
        const arabicPattern = /[\u0600-\u06FF]/;
        return arabicPattern.test(text) ? "ar" : "en";
      }

      // Translation function
      async function translateText(text, sourceLang, targetLang) {
        translationStatus.innerHTML =
          '<div class="spinner-border spinner-border-sm text-primary me-2"></div>جاري الترجمة...';

        try {
          const response = await fetch("/patients/api/translate/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              text: text,
              source_language: sourceLang === "auto" ? "auto" : sourceLang,
              target_language: targetLang,
            }),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();

          if (data.success) {
            translationStatus.innerHTML =
              '<span class="text-success"><i class="fas fa-check-circle me-1"></i>تمت الترجمة بنجاح</span>';
            return data.translated_text;
          } else {
            throw new Error(data.error || "Translation failed");
          }
        } catch (error) {
          console.error("Translation error:", error);
          translationStatus.innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i>فشلت الترجمة: ${error.message}</span>`;
          return `[خطأ في الترجمة: ${text}]`;
        }
      }

      // Translate button click handler
      translateBtn.addEventListener("click", async function () {
        const text = originalText.value.trim();

        if (!text) {
          translationStatus.innerHTML =
            '<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i>الرجاء إدخال نص للترجمة</span>';
          return;
        }

        let sourceLang = sourceLanguage.value;
        if (sourceLang === "auto") {
          sourceLang = detectLanguage(text);
        }

        const targetLang = targetLanguage.value;

        if (sourceLang === targetLang) {
          translationStatus.innerHTML =
            '<span class="text-warning"><i class="fas fa-info-circle me-1"></i>لغة المصدر والهدف متطابقة</span>';
          return;
        }

        try {
          translateBtn.disabled = true;
          translateBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin me-2"></i>جاري الترجمة...';

          const translation = await translateText(text, sourceLang, targetLang);
          translatedText.value = translation;
        } catch (error) {
          translationStatus.innerHTML =
            '<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i>فشلت الترجمة، يرجى المحاولة مرة أخرى</span>';
          console.error("Translation error:", error);
        } finally {
          translateBtn.disabled = false;
          translateBtn.innerHTML = '<i class="fas fa-language me-2"></i>ترجم';
        }
      });
    </script>
  </body>
</html>
