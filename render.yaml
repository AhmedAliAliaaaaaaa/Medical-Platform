services:
  - type: web
    name: medical-platform-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT medical_platform.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: medical-platform-api
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: medical-platform-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: https://medical-platform-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://medical-platform-api.onrender.com

databases:
  - name: medical-platform-db
    databaseName: medical_platform
    user: medical_platform
